services:
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/.next
    command: npm run dev:frontend
    env_file:
      - ./apps/frontend/.env
    environment:
      - NEXT_DISABLE_SWC_WASM=0
      - NEXT_PRIVATE_LOCAL_WEBPACK=true 
      - NEXT_PUBLIC_API_URL=http://localhost:4000/graphql
      - NEST_GRAPHQL_URL=http://backend:4000/graphql
      - DATABASE_URL=postgresql://giftan_user:giftan_password@db:5432/giftan_db
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=giftan_admin
      - MINIO_ROOT_PASSWORD=giftan_secure_password
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/.nest
      - /app/apps/backend/dist
    command: npm run dev:backend
    env_file:
      - ./apps/backend/.env
    environment:
      - DATABASE_URL=postgresql://giftan_user:giftan_password@db:5432/giftan_db
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: giftan_user
      POSTGRES_PASSWORD: giftan_password
      POSTGRES_DB: giftan_db
    ports:
      - "5433:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U giftan_user -d giftan_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: giftan_admin
      MINIO_ROOT_PASSWORD: giftan_secure_password
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["/usr/bin/mc"]
    depends_on:
      - minio
    command: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/avatars;
      exit 0;
      "

volumes:
  db_volume: